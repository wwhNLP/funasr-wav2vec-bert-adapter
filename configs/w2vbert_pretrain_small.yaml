# fairseq2 w2v-BERT 600m model defaults at 7f06d6f4.
# Batch/length budgets below are raw audio samples; the collator emits FBANK frames.
model: W2VBertModel
model_conf:
  num_bert_encoder_layers: 16
  num_target_codebooks: 1
  w2v2_config:
    model_dim: 1024
    final_dim: 768
    final_proj_bias: true
    num_distractors: 100
    logit_temp: 0.1
    frontend_conf:
      model_dim: 1024
      feature_dim: 160
      use_fbank: true
      feature_extractor_conf:
        num_fbank_channels: 80
        stride: 2
        sample_every_k: 1
      pos_encoder_conf: null
      layer_norm_features: false
      first_pass_dropout_p: 0.0
      dropout_p: 0.0
    encoder: Fairseq2ConformerEncoder
    encoder_conf:
      input_size: 1024
      output_size: 1024
      attention_heads: 16
      linear_units: 4096
      num_blocks: 24
      cnn_module_kernel: 31
      max_seq_len: 4096
      input_layer: null
      dropout_rate: 0.0
      ffn_inner_dropout_rate: 0.0
      stochastic_depth_rate: 0.0
    masker_conf:
      model_dim: 1024
      temporal_mask_span_len: 10
      max_temporal_mask_prob: 0.65
      min_num_temporal_mask_spans: 2
      spatial_mask_span_len: 10
      max_spatial_mask_prob: 0.0
      min_num_spatial_mask_spans: 2
    quantizer_conf:
      model_dim: 160
      quantized_dim: 1024
      num_codebooks: 1
      num_codebook_entries: 1024
      codebook_sampling_temperature:
      - 2.0
      - 0.1
      - 0.999995
tokenizer: null
frontend: null
cudnn_deterministic: true
train_conf:
  accum_grad: 1
  grad_clip: 5
  max_epoch: 20
  resume: true
  val_scheduler_criterion:
  - valid
  - loss
  best_model_criterion:
  - - train
    - loss
    - min
  keep_nbest_models: 15
  avg_keep_nbest_models_type: loss
  log_interval: 1
  find_unused_parameters: true
optim: adamw
optim_conf:
  lr: 4.0e-05
  betas:
  - 0.9
  - 0.98
  eps: 1.0e-06
scheduler: WarmupPolynomialDecayLR
scheduler_conf:
  warmup_steps: 32000
  total_steps: 400000
  power: 1.5
  end_lr: 1.0e-06
dataset: SelfSupervisedLargeAudioDataset
dataset_conf:
  dataloader: DataloaderIterable
  batch_num_epoch: 10000
  valid_batch_num_epoch: 100
  shuffler_size: 200
  batch_size: 1000000
  batch_type: frame
  sort_size: 200
  min_wav_len: 48000
  max_wav_len: 960000
  pin_memory: true
  num_workers: 2
  prefetch_factor: 2
  feature_type: fbank
  fbank_conf:
    num_mel_bins: 80
    waveform_scale: 1.0
    standardize: false
val_conf:
  batch_size: 16
  max_frames_in_batch: 6000
